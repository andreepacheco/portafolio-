<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de contacto">
  <title>Contacto | Portafolio de Pacheco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <header>
    <p class="logo">Pacheco</p>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="proyectos.html">Proyectos</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main id="contenido">
    <section aria-labelledby="titulo-contacto">
      <h1 id="titulo-contacto">Contacto</h1>
      <p>Escríbeme y te respondo lo antes posible.</p>
      <form action="#" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="name">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required autocomplete="email">

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button class="boton" type="submit">Enviar mensaje</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Pacheco. Ingeniería en Administración de Sistemas, FIME-UANL.</p>
  </footer>
</body>
</html>
